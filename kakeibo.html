<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>かけいぼ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#fff;--bg2:#f5f5f3;--bg3:#efefed;
  --text:#1a1a1a;--text2:#666;--text3:#999;
  --border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.18);
  --green:#1D9E75;--green-bg:#E1F5EE;
  --red:#D85A30;--red-bg:#FAECE7;
  --blue:#1D4ED8;
  --radius:10px;--radius-lg:14px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#3a3a3c;
  --text:#f2f2f7;--text2:#aeaeb2;--text3:#636366;
  --border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.18);
  --green-bg:#0a3d2b;--red-bg:#3d1a0a;
}}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg3);color:var(--text);min-height:100vh;}
.app{max-width:430px;margin:0 auto;padding-bottom:88px;}
.header{background:var(--bg);border-bottom:1px solid var(--border);padding:14px 16px;position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;}
.header h1{font-size:18px;font-weight:600;}
.hbtn{background:none;border:1px solid var(--border2);border-radius:8px;padding:6px 12px;font-size:12px;color:var(--text2);cursor:pointer;}
.month-nav{background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--border);}
.mnbtn{background:none;border:1px solid var(--border2);border-radius:8px;width:32px;height:32px;cursor:pointer;color:var(--text);font-size:16px;}
.month-nav span{font-size:16px;font-weight:600;}
.tabs{display:flex;background:var(--bg);border-bottom:1px solid var(--border);}
.tab{flex:1;text-align:center;padding:10px 0;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);}
.tab-content{display:none;}
.tab-content.active{display:block;}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px;}
.stat{background:var(--bg);border-radius:var(--radius-lg);padding:12px 14px;}
.stat .lbl{font-size:11px;color:var(--text2);margin-bottom:4px;}
.stat .val{font-size:20px;font-weight:600;}
.stat.full{grid-column:span 2;}
.v-in{color:var(--green);}
.v-ex{color:var(--red);}
.bcard{background:var(--bg);border-radius:var(--radius-lg);margin:0 12px 12px;padding:14px;}
.btop{display:flex;justify-content:space-between;margin-bottom:10px;}
.btop span{font-size:13px;color:var(--text2);}
.btop strong{font-size:13px;font-weight:600;}
.btrack{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden;}
.bfill{height:100%;border-radius:99px;transition:width 0.4s;}
.bmsg{font-size:12px;color:var(--text2);margin-top:6px;}
.sh{padding:4px 16px 8px;font-size:13px;font-weight:600;color:var(--text2);}
.elist{padding:0 12px;display:flex;flex-direction:column;gap:6px;margin-bottom:8px;}
.entry{background:var(--bg);border-radius:var(--radius-lg);padding:12px 14px;display:flex;align-items:center;gap:12px;}
.eico{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;color:#fff;}
.einfo{flex:1;min-width:0;}
.ename{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.emeta{font-size:11px;color:var(--text2);margin-top:2px;}
.eamt{font-size:15px;font-weight:600;flex-shrink:0;}
.empty{text-align:center;padding:40px 20px;color:var(--text3);font-size:14px;}
.ss{padding:12px;}
.sc{background:var(--bg);border-radius:var(--radius-lg);margin-bottom:10px;overflow:hidden;}
.sct{font-size:13px;font-weight:600;color:var(--text2);padding:12px 14px 8px;border-bottom:1px solid var(--border);}
.crow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);}
.crow:last-child{border-bottom:none;}
.cico{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0;}
.cinfo{flex:1;}
.cname{font-size:13px;font-weight:500;}
.cbw{height:4px;background:var(--bg2);border-radius:99px;margin-top:4px;overflow:hidden;}
.cb{height:100%;border-radius:99px;transition:width 0.4s;}
.camt{font-size:13px;font-weight:600;flex-shrink:0;}
.ccnt{font-size:11px;color:var(--text3);}
.fab-area{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;padding:12px;background:linear-gradient(to top,var(--bg3) 60%,transparent);display:flex;gap:10px;z-index:20;}
.fab{height:50px;border-radius:25px;border:none;cursor:pointer;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;padding:0 22px;flex:1;justify-content:center;}
.fab.primary{background:var(--blue);color:#fff;}
.fab.cam{background:var(--bg);border:1px solid var(--border2);color:var(--text);flex:0 0 auto;padding:0 18px;}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:30;align-items:flex-end;justify-content:center;}
.overlay.open{display:flex;}
.sheet{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:430px;padding:20px 16px 32px;max-height:90vh;overflow-y:auto;}
.hdl{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 16px;}
.sheet h2{font-size:17px;font-weight:600;margin-bottom:16px;}
.ttog{display:flex;gap:8px;margin-bottom:14px;}
.tbtn{flex:1;height:38px;border-radius:var(--radius);border:1px solid var(--border2);background:none;font-size:14px;cursor:pointer;color:var(--text2);font-weight:500;}
.tbtn.ae{background:var(--red-bg);color:var(--red);border-color:var(--red);}
.tbtn.ai{background:var(--green-bg);color:var(--green);border-color:var(--green);}
.fr{margin-bottom:12px;}
.fr label{font-size:12px;color:var(--text2);display:block;margin-bottom:5px;font-weight:500;}
.fr input,.fr select{width:100%;height:42px;border:1px solid var(--border2);border-radius:var(--radius);padding:0 12px;font-size:15px;background:var(--bg2);color:var(--text);outline:none;}
.sbtn{width:100%;height:48px;background:var(--blue);color:#fff;border:none;border-radius:var(--radius-lg);font-size:16px;font-weight:600;cursor:pointer;margin-top:8px;}
.cbtn{width:100%;height:44px;background:none;border:none;color:var(--text2);font-size:14px;margin-top:8px;cursor:pointer;}
.cprev{width:100%;height:200px;background:#000;border-radius:var(--radius-lg);overflow:hidden;display:flex;align-items:center;justify-content:center;margin-bottom:12px;}
.cprev video{width:100%;height:100%;object-fit:cover;}
.cph{color:#888;font-size:13px;text-align:center;padding:20px;}
.aibox{background:var(--bg2);border-radius:var(--radius);padding:12px;font-size:13px;color:var(--text2);min-height:48px;line-height:1.6;}
.ritems{display:flex;flex-direction:column;gap:6px;margin:12px 0;}
.ritem{display:flex;align-items:center;gap:10px;background:var(--bg2);border-radius:var(--radius);padding:10px 12px;}
.ritem input[type=checkbox]{width:18px;height:18px;flex-shrink:0;accent-color:var(--blue);}
.rinfo{flex:1;min-width:0;}
.rname{font-size:13px;font-weight:500;}
.ritem select{height:28px;border:1px solid var(--border2);border-radius:6px;font-size:12px;background:var(--bg);color:var(--text);padding:0 6px;margin-top:4px;}
.ramt{font-size:14px;font-weight:600;color:var(--red);flex-shrink:0;}
.cambtns{display:flex;gap:8px;margin-top:12px;}
.cambtns button{flex:1;height:44px;border-radius:var(--radius);border:1px solid var(--border2);background:none;font-size:14px;cursor:pointer;color:var(--text);font-weight:500;}
.cambtns button.shoot{background:var(--blue);color:#fff;border-color:transparent;}
.cambtns button:disabled{opacity:0.4;cursor:not-allowed;}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>かけいぼ</h1>
    <button class="hbtn" onclick="openBudget()">予算設定</button>
  </div>
  <div class="month-nav">
    <button class="mnbtn" onclick="changeMonth(-1)">&lt;</button>
    <span id="mlabel"></span>
    <button class="mnbtn" onclick="changeMonth(1)">&gt;</button>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="switchTab(0)">ホーム</div>
    <div class="tab" onclick="switchTab(1)">集計</div>
    <div class="tab" onclick="switchTab(2)">明細</div>
  </div>
  <div class="tab-content active" id="tc0">
    <div class="stats">
      <div class="stat"><div class="lbl">収入</div><div class="val v-in" id="t-inc">¥0</div></div>
      <div class="stat"><div class="lbl">支出</div><div class="val v-ex" id="t-exp">¥0</div></div>
      <div class="stat full"><div class="lbl">残高</div><div class="val" id="t-bal">¥0</div></div>
    </div>
    <div class="bcard">
      <div class="btop"><span>今月の予算</span><strong id="blbl"></strong></div>
      <div class="btrack"><div class="bfill" id="bfill" style="width:0%;background:var(--green);"></div></div>
      <div class="bmsg" id="bmsg"></div>
    </div>
    <div class="sh">最近の明細</div>
    <div class="elist" id="rlist"></div>
  </div>
  <div class="tab-content" id="tc1">
    <div class="ss">
      <div class="sc"><div class="sct">カテゴリ別支出</div><div id="catlist"></div></div>
      <div class="sc"><div class="sct">カテゴリ別収入</div><div id="inclist"></div></div>
    </div>
  </div>
  <div class="tab-content" id="tc2">
    <div style="height:12px;"></div>
    <div class="elist" id="alist"></div>
  </div>
</div>

<div class="fab-area">
  <button class="fab cam" onclick="openCamera()">カメラ</button>
  <button class="fab primary" onclick="openAdd()">+ 追加</button>
</div>

<div class="overlay" id="ov-add">
  <div class="sheet">
    <div class="hdl"></div>
    <h2>収支を追加</h2>
    <div class="ttog">
      <button class="tbtn ae" id="btn-ex" onclick="setType('expense')">支出</button>
      <button class="tbtn" id="btn-in" onclick="setType('income')">収入</button>
    </div>
    <div class="fr"><label>金額（円）</label><input type="number" id="i-amt" placeholder="1500" inputmode="numeric"></div>
    <div class="fr"><label>メモ</label><input type="text" id="i-name" placeholder="スーパーなど"></div>
    <div class="fr"><label>カテゴリ</label>
      <select id="i-cat">
        <option value="食費">食費</option>
        <option value="交通">交通</option>
        <option value="日用品">日用品</option>
        <option value="娯楽">娯楽</option>
        <option value="光熱費">光熱費</option>
        <option value="医療">医療</option>
        <option value="給与">給与</option>
        <option value="その他">その他</option>
      </select>
    </div>
    <div class="fr"><label>日付</label><input type="date" id="i-date"></div>
    <button class="sbtn" onclick="addEntry()">保存する</button>
    <button class="cbtn" onclick="closeOv('ov-add')">キャンセル</button>
  </div>
</div>

<div class="overlay" id="ov-cam">
  <div class="sheet">
    <div class="hdl"></div>
    <h2>レシートを撮影</h2>
    <div class="cprev" id="cprev">
      <video id="cvid" autoplay playsinline style="display:none;"></video>
      <canvas id="ccanvas" style="display:none;"></canvas>
      <div class="cph" id="cph">「起動」を押してカメラを開始</div>
    </div>
    <div class="aibox" id="aibox">AIがレシートの各項目を読み取ります</div>
    <div class="ritems" id="ritems" style="display:none;"></div>
    <div class="cambtns">
      <button onclick="startCam()">起動</button>
      <button class="shoot" id="btn-shoot" onclick="shoot()" disabled>撮影</button>
    </div>
    <button class="sbtn" id="btn-save-r" style="display:none;margin-top:12px;" onclick="saveReceipt()">選択した項目を保存</button>
    <button class="cbtn" onclick="closeCam()">キャンセル</button>
  </div>
</div>

<div class="overlay" id="ov-budget">
  <div class="sheet">
    <div class="hdl"></div>
    <h2>予算を設定</h2>
    <div class="fr"><label>月の支出予算（円）</label><input type="number" id="i-budget" placeholder="100000" inputmode="numeric"></div>
    <button class="sbtn" onclick="saveBudget()">保存する</button>
    <button class="cbtn" onclick="closeOv('ov-budget')">キャンセル</button>
  </div>
</div>

<script>
var SK = 'kakeibo_v5';
var BK = 'kakeibo_b_v5';
var CATS = ['食費','交通','日用品','娯楽','光熱費','医療','給与','その他'];
var COLORS = ['#e74c3c','#3498db','#2ecc71','#9b59b6','#f39c12','#1abc9c','#e67e22','#95a5a6'];
var ML = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
var entries = [];
var budget = 100000;
var cy, cm, etype = 'expense';
var vstream = null;
var rItems = [];

function fmt(n) { return '\u00a5' + Math.round(n).toLocaleString(); }

function load() {
  try { entries = JSON.parse(localStorage.getItem(SK)) || []; } catch(e) { entries = []; }
  try { budget = parseInt(localStorage.getItem(BK)) || 100000; } catch(e) { budget = 100000; }
}

function save() {
  try { localStorage.setItem(SK, JSON.stringify(entries)); localStorage.setItem(BK, String(budget)); } catch(e) {}
}

function init() {
  var n = new Date(); cy = n.getFullYear(); cm = n.getMonth();
  document.getElementById('i-date').value = n.toISOString().split('T')[0];
  load(); render();
}

function changeMonth(d) {
  cm += d;
  if (cm > 11) { cm = 0; cy++; }
  if (cm < 0) { cm = 11; cy--; }
  render();
}

function getMe() {
  return entries.filter(function(e) {
    var d = new Date(e.date);
    return d.getFullYear() === cy && d.getMonth() === cm;
  });
}

function switchTab(n) {
  var tabs = document.querySelectorAll('.tab');
  var tcs = document.querySelectorAll('.tab-content');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].className = 'tab' + (i === n ? ' active' : '');
    tcs[i].className = 'tab-content' + (i === n ? ' active' : '');
  }
  render();
}

function render() {
  document.getElementById('mlabel').textContent = cy + '\u5e74' + ML[cm];
  var me = getMe();
  var inc = 0, exp = 0;
  for (var i = 0; i < me.length; i++) {
    if (me[i].type === 'income') inc += me[i].amount;
    else exp += me[i].amount;
  }
  document.getElementById('t-inc').textContent = fmt(inc);
  document.getElementById('t-exp').textContent = fmt(exp);
  document.getElementById('t-bal').textContent = fmt(inc - exp);
  var pct = budget > 0 ? Math.min(100, Math.round(exp / budget * 100)) : 0;
  document.getElementById('blbl').textContent = fmt(exp) + ' / ' + fmt(budget);
  document.getElementById('bfill').style.width = pct + '%';
  document.getElementById('bfill').style.background = pct >= 90 ? 'var(--red)' : pct >= 70 ? '#e67e22' : 'var(--green)';
  document.getElementById('bmsg').textContent = pct >= 100 ? '\u4e88\u7b97\u3092\u8d85\u3048\u307e\u3057\u305f' : '\u6b8b\u308a' + fmt(budget - exp) + '(' + (100 - pct) + '%)';

  var sorted = me.slice().sort(function(a, b) { return new Date(b.date) - new Date(a.date); });
  var rh = '', ah = '';
  for (var i = 0; i < sorted.length; i++) {
    var h = entryHTML(sorted[i]);
    if (i < 5) rh += h;
    ah += h;
  }
  document.getElementById('rlist').innerHTML = rh || '<div class="empty">\u307e\u3060\u8a18\u9332\u304c\u3042\u308a\u307e\u305b\u3093</div>';
  document.getElementById('alist').innerHTML = ah || '<div class="empty">\u307e\u3060\u8a18\u9332\u304c\u3042\u308a\u307e\u305b\u3093</div>';

  renderSummary(me, exp, inc);
}

function catColor(cat) {
  var i = CATS.indexOf(cat);
  return i >= 0 ? COLORS[i] : '#95a5a6';
}

function entryHTML(e) {
  var abbr = e.category.charAt(0);
  var col = catColor(e.category);
  var bg = e.type === 'income' ? 'var(--green-bg)' : 'var(--red-bg)';
  var fc = e.type === 'income' ? 'var(--green)' : 'var(--red)';
  var sign = e.type === 'income' ? '+' : '-';
  return '<div class="entry">'
    + '<div class="eico" style="background:' + col + '">' + abbr + '</div>'
    + '<div class="einfo"><div class="ename">' + e.name + '</div><div class="emeta">' + e.date + ' ' + e.category + '</div></div>'
    + '<div class="eamt" style="color:' + fc + '">' + sign + fmt(e.amount) + '</div>'
    + '</div>';
}

function renderSummary(me, totalExp, totalInc) {
  var em = {}, im = {};
  for (var i = 0; i < me.length; i++) {
    var e = me[i];
    var m = e.type === 'expense' ? em : im;
    if (!m[e.category]) m[e.category] = { a: 0, c: 0 };
    m[e.category].a += e.amount;
    m[e.category].c++;
  }
  document.getElementById('catlist').innerHTML = summaryHTML(em, totalExp, 'var(--red)');
  document.getElementById('inclist').innerHTML = summaryHTML(im, totalInc, 'var(--green)');
}

function summaryHTML(map, total, color) {
  var keys = Object.keys(map).sort(function(a, b) { return map[b].a - map[a].a; });
  if (!keys.length) return '<div style="padding:16px;text-align:center;color:var(--text3);font-size:13px;">\u8a18\u9332\u304c\u3042\u308a\u307e\u305b\u3093</div>';
  var h = '';
  for (var i = 0; i < keys.length; i++) {
    var cat = keys[i];
    var v = map[cat];
    var pct = total > 0 ? Math.round(v.a / total * 100) : 0;
    var col = catColor(cat);
    h += '<div class="crow">'
      + '<div class="cico" style="background:' + col + '">' + cat.charAt(0) + '</div>'
      + '<div class="cinfo"><div class="cname">' + cat + ' <span class="ccnt">' + v.c + '\u4ef6 ' + pct + '%</span></div>'
      + '<div class="cbw"><div class="cb" style="width:' + pct + '%;background:' + color + '"></div></div></div>'
      + '<div class="camt" style="color:' + color + '">' + fmt(v.a) + '</div>'
      + '</div>';
  }
  return h;
}

function openAdd() { document.getElementById('ov-add').classList.add('open'); document.getElementById('i-amt').focus(); }
function closeOv(id) { document.getElementById(id).classList.remove('open'); }
function setType(t) {
  etype = t;
  document.getElementById('btn-ex').className = 'tbtn' + (t === 'expense' ? ' ae' : '');
  document.getElementById('btn-in').className = 'tbtn' + (t === 'income' ? ' ai' : '');
  document.getElementById('i-cat').value = t === 'income' ? '\u7d66\u4e0e' : '\u98df\u8cbb';
}
function addEntry() {
  var a = parseFloat(document.getElementById('i-amt').value);
  var n = document.getElementById('i-name').value.trim() || '\u30e1\u30e2\u306a\u3057';
  var c = document.getElementById('i-cat').value;
  var d = document.getElementById('i-date').value || new Date().toISOString().split('T')[0];
  if (!a || a <= 0) { alert('\u91d1\u984d\u3092\u5165\u529b\u3057\u3066\u304f\u3060\u3055\u3044'); return; }
  entries.push({ id: Date.now(), type: etype, amount: a, name: n, category: c, date: d });
  save(); render();
  document.getElementById('i-amt').value = '';
  document.getElementById('i-name').value = '';
  closeOv('ov-add');
}

function openCamera() { document.getElementById('ov-cam').classList.add('open'); }
function closeCam() {
  closeOv('ov-cam');
  if (vstream) { vstream.getTracks().forEach(function(t) { t.stop(); }); vstream = null; }
  document.getElementById('cvid').style.display = 'none';
  document.getElementById('cph').style.display = 'block';
  document.getElementById('btn-shoot').disabled = true;
  document.getElementById('aibox').textContent = 'AI\u304c\u30ec\u30b7\u30fc\u30c8\u306e\u5404\u9805\u76ee\u3092\u8aad\u307f\u53d6\u308a\u307e\u3059';
  document.getElementById('ritems').style.display = 'none';
  document.getElementById('ritems').innerHTML = '';
  document.getElementById('btn-save-r').style.display = 'none';
  rItems = [];
}
function startCam() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert('\u3053\u306e\u30d6\u30e9\u30a6\u30b6\u3067\u306f\u30ab\u30e1\u30e9\u304c\u4f7f\u3048\u307e\u305b\u3093');
    return;
  }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
    .then(function(stream) {
      vstream = stream;
      var v = document.getElementById('cvid');
      v.srcObject = stream;
      v.style.display = 'block';
      document.getElementById('cph').style.display = 'none';
      document.getElementById('btn-shoot').disabled = false;
    })
    .catch(function(e) {
      alert('\u30ab\u30e1\u30e9\u30a8\u30e9\u30fc: ' + e.message);
    });
}
function shoot() {
  var v = document.getElementById('cvid');
  var canvas = document.getElementById('ccanvas');
  canvas.width = v.videoWidth; canvas.height = v.videoHeight;
  canvas.getContext('2d').drawImage(v, 0, 0);
  var img = canvas.toDataURL('image/jpeg', 0.7).split(',')[1];
  var ai = document.getElementById('aibox');
  ai.textContent = 'AI\u304c\u8aad\u307f\u53d6\u308a\u4e2d...';
  document.getElementById('btn-shoot').disabled = true;
  document.getElementById('ritems').style.display = 'none';
  document.getElementById('btn-save-r').style.display = 'none';
  fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 800,
      messages: [{
        role: 'user',
        content: [
          { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: img } },
          { type: 'text', text: 'Extract each item from this receipt and return ONLY a JSON array, no markdown, no explanation: [{"name":"item name in Japanese","amount":number,"category":"one of: \u98df\u8cbb/\u4ea4\u901a/\u65e5\u7528\u54c1/\u5a2f\u697d/\u5149\u71b1\u8cbb/\u533b\u7642/\u305d\u306e\u4ed6","date":"YYYY-MM-DD"}]. Use today if date unknown. Exclude total rows.' }
        ]
      }]
    })
  })
  .then(function(res) { return res.json(); })
  .then(function(data) {
    var text = '';
    for (var i = 0; i < data.content.length; i++) { if (data.content[i].text) text += data.content[i].text; }
    text = text.replace(/```json|```/g, '').trim();
    var items = JSON.parse(text);
    rItems = items;
    ai.textContent = items.length + '\u4ef6\u306e\u9805\u76ee\u3092\u8aad\u307f\u53d6\u308a\u307e\u3057\u305f\u3002\u4fdd\u5b58\u3059\u308b\u9805\u76ee\u3092\u9078\u3093\u3067\u304f\u3060\u3055\u3044\u3002';
    var el = document.getElementById('ritems');
    el.style.display = 'flex';
    var h = '';
    for (var i = 0; i < items.length; i++) {
      var item = items[i];
      var opts = '';
      for (var j = 0; j < CATS.length; j++) {
        opts += '<option value="' + CATS[j] + '"' + (CATS[j] === item.category ? ' selected' : '') + '>' + CATS[j] + '</option>';
      }
      h += '<div class="ritem">'
        + '<input type="checkbox" id="ri' + i + '" checked>'
        + '<div class="rinfo"><div class="rname">' + item.name + '</div>'
        + '<select id="rc' + i + '">' + opts + '</select></div>'
        + '<div class="ramt">' + fmt(item.amount) + '</div>'
        + '</div>';
    }
    el.innerHTML = h;
    document.getElementById('btn-save-r').style.display = 'block';
  })
  .catch(function(e) {
    document.getElementById('aibox').textContent = '\u8aad\u307f\u53d6\u308a\u306b\u5931\u6557\u3057\u307e\u3057\u305f\u3002\u3082\u3046\u4e00\u5ea6\u304a\u8a66\u3057\u304f\u3060\u3055\u3044\u3002';
    document.getElementById('btn-shoot').disabled = false;
  });
}
function saveReceipt() {
  var today = new Date().toISOString().split('T')[0];
  for (var i = 0; i < rItems.length; i++) {
    var cb = document.getElementById('ri' + i);
    var cat = document.getElementById('rc' + i);
    if (cb && cb.checked) {
      entries.push({ id: Date.now() + i, type: 'expense', amount: rItems[i].amount, name: rItems[i].name, category: cat ? cat.value : rItems[i].category, date: rItems[i].date || today });
    }
  }
  save(); render(); closeCam();
}

function openBudget() {
  document.getElementById('i-budget').value = budget;
  document.getElementById('ov-budget').classList.add('open');
}
function saveBudget() {
  var v = parseInt(document.getElementById('i-budget').value);
  if (v > 0) { budget = v; save(); render(); }
  closeOv('ov-budget');
}

var ovs = document.querySelectorAll('.overlay');
for (var i = 0; i < ovs.length; i++) {
  ovs[i].addEventListener('click', function(e) { if (e.target === this) this.classList.remove('open'); });
}

init();
</script>
