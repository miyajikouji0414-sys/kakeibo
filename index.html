<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>かけいぼ</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#fff;--bg2:#f5f5f3;--bg3:#efefed;
  --text:#1a1a1a;--text2:#666;--text3:#999;
  --border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.18);
  --green:#1D9E75;--green-bg:#E1F5EE;
  --red:#D85A30;--red-bg:#FAECE7;
  --blue:#1D4ED8;
  --radius:10px;--radius-lg:14px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#3a3a3c;
    --text:#f2f2f7;--text2:#aeaeb2;--text3:#636366;
    --border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.18);
    --green-bg:#0a3d2b;--red-bg:#3d1a0a;
  }
}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:var(--bg3);color:var(--text);min-height:100vh;}
.app{max-width:430px;margin:0 auto;background:var(--bg3);min-height:100vh;padding-bottom:88px;}
.header{background:var(--bg);border-bottom:0.5px solid var(--border);padding:16px;position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;}
.header-left h1{font-size:18px;font-weight:600;letter-spacing:-0.3px;}
.header-left p{font-size:12px;color:var(--text2);margin-top:2px;}
.header-right button{background:none;border:0.5px solid var(--border2);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:4px;}
.month-nav{background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:0.5px solid var(--border);}
.month-nav button{background:none;border:0.5px solid var(--border2);border-radius:8px;width:32px;height:32px;cursor:pointer;color:var(--text);font-size:16px;display:flex;align-items:center;justify-content:center;}
.month-nav span{font-size:16px;font-weight:600;}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px;margin:0;}
.stat{background:var(--bg);border-radius:var(--radius-lg);padding:12px 14px;}
.stat .label{font-size:11px;color:var(--text2);margin-bottom:4px;display:flex;align-items:center;gap:4px;}
.stat .value{font-size:22px;font-weight:600;letter-spacing:-0.5px;}
.stat.full{grid-column:span 2;}
.v-income{color:var(--green);}
.v-expense{color:var(--red);}
.budget-card{background:var(--bg);border-radius:var(--radius-lg);margin:0 12px 12px;padding:14px;}
.budget-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.budget-top span{font-size:13px;color:var(--text2);}
.budget-top strong{font-size:13px;font-weight:600;}
.bar-track{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden;}
.bar-fill{height:100%;border-radius:99px;transition:width 0.5s cubic-bezier(.4,0,.2,1);}
.budget-msg{font-size:12px;color:var(--text2);margin-top:6px;}
.section-header{display:flex;justify-content:space-between;align-items:center;padding:4px 16px 8px;}
.section-header span{font-size:13px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;}
.entry-list{padding:0 12px;display:flex;flex-direction:column;gap:6px;margin-bottom:8px;}
.entry{background:var(--bg);border-radius:var(--radius-lg);padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:opacity 0.15s;}
.entry:active{opacity:0.7;}
.entry .icon{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.entry .info{flex:1;min-width:0;}
.entry .info .name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.entry .info .meta{font-size:11px;color:var(--text2);margin-top:2px;}
.entry .amount{font-size:15px;font-weight:600;flex-shrink:0;}
.empty{text-align:center;padding:40px 20px;color:var(--text3);font-size:14px;}
.empty i{font-size:36px;display:block;margin-bottom:10px;}
.fab-area{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;padding:12px;background:linear-gradient(to top,var(--bg3) 60%,transparent);display:flex;gap:10px;z-index:20;}
.fab{height:50px;border-radius:25px;border:none;cursor:pointer;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;padding:0 22px;transition:transform 0.15s,opacity 0.15s;flex:1;justify-content:center;}
.fab:active{transform:scale(0.96);opacity:0.85;}
.fab.primary{background:var(--blue);color:#fff;}
.fab.camera{background:var(--bg);border:0.5px solid var(--border2);color:var(--text);flex:0 0 auto;padding:0 18px;}
/* Modal */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:30;align-items:flex-end;justify-content:center;}
.overlay.open{display:flex;}
.sheet{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:430px;padding:20px 16px;padding-bottom:max(24px,env(safe-area-inset-bottom));}
.sheet-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 16px;}
.sheet h2{font-size:17px;font-weight:600;margin-bottom:16px;}
.type-toggle{display:flex;gap:8px;margin-bottom:16px;}
.type-btn{flex:1;height:38px;border-radius:var(--radius);border:0.5px solid var(--border2);background:none;font-size:14px;cursor:pointer;color:var(--text2);font-weight:500;transition:all 0.15s;}
.type-btn.ae{background:var(--red-bg);color:var(--red);border-color:var(--red);}
.type-btn.ai{background:var(--green-bg);color:var(--green);border-color:var(--green);}
.form-row{margin-bottom:12px;}
.form-row label{font-size:12px;color:var(--text2);display:block;margin-bottom:5px;font-weight:500;}
.form-row input,.form-row select{width:100%;height:42px;border:0.5px solid var(--border2);border-radius:var(--radius);padding:0 12px;font-size:15px;background:var(--bg2);color:var(--text);outline:none;}
.form-row input:focus,.form-row select:focus{border-color:var(--blue);}
.save-btn{width:100%;height:48px;background:var(--blue);color:#fff;border:none;border-radius:var(--radius-lg);font-size:16px;font-weight:600;cursor:pointer;margin-top:8px;}
.save-btn:disabled{opacity:0.5;cursor:not-allowed;}
/* Camera */
.cam-preview{width:100%;height:220px;background:#000;border-radius:var(--radius-lg);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:12px;}
.cam-preview video{width:100%;height:100%;object-fit:cover;}
.cam-ph{color:#888;font-size:13px;text-align:center;}
.cam-ph i{font-size:36px;display:block;margin-bottom:8px;}
.ai-box{background:var(--bg2);border-radius:var(--radius);padding:12px;font-size:13px;color:var(--text2);min-height:64px;line-height:1.6;}
.ai-box.done{color:var(--text);}
.cam-btns{display:flex;gap:8px;margin-top:12px;}
.cam-btns button{flex:1;height:44px;border-radius:var(--radius);border:0.5px solid var(--border2);background:none;font-size:14px;cursor:pointer;color:var(--text);font-weight:500;}
.cam-btns button.shoot{background:var(--blue);color:#fff;border-color:transparent;}
.cam-btns button:disabled{opacity:0.4;cursor:not-allowed;}
/* Budget edit */
.budget-edit-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.budget-edit-row input{flex:1;height:42px;border:0.5px solid var(--border2);border-radius:var(--radius);padding:0 12px;font-size:15px;background:var(--bg2);color:var(--text);outline:none;}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="header">
    <div class="header-left">
      <h1>💰 かけいぼ</h1>
      <p id="summary-text">読み込み中...</p>
    </div>
    <div class="header-right">
      <button onclick="openBudget()"><i class="ti ti-settings" style="font-size:14px;"></i> 予算</button>
    </div>
  </div>

  <div class="month-nav">
    <button onclick="changeMonth(-1)"><i class="ti ti-chevron-left"></i></button>
    <span id="month-label"></span>
    <button onclick="changeMonth(1)"><i class="ti ti-chevron-right"></i></button>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="label"><i class="ti ti-trending-up" style="font-size:13px;color:var(--green);"></i>収入</div>
      <div class="value v-income" id="total-income">¥0</div>
    </div>
    <div class="stat">
      <div class="label"><i class="ti ti-trending-down" style="font-size:13px;color:var(--red);"></i>支出</div>
      <div class="value v-expense" id="total-expense">¥0</div>
    </div>
    <div class="stat full">
      <div class="label">残高</div>
      <div class="value" id="total-balance">¥0</div>
    </div>
  </div>

  <div class="budget-card">
    <div class="budget-top">
      <span>今月の予算</span>
      <strong id="budget-label">¥0 / ¥0</strong>
    </div>
    <div class="bar-track"><div class="bar-fill" id="budget-fill" style="width:0%;background:var(--green);"></div></div>
    <div class="budget-msg" id="budget-msg"></div>
  </div>

  <div class="section-header"><span>明細</span></div>
  <div class="entry-list" id="entry-list"></div>
</div>

<div class="fab-area">
  <button class="fab camera" onclick="openCamera()"><i class="ti ti-camera"></i> レシート</button>
  <button class="fab primary" onclick="openAdd()"><i class="ti ti-plus"></i> 追加</button>
</div>

<!-- 手動入力 -->
<div class="overlay" id="add-overlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2>収支を追加</h2>
    <div class="type-toggle">
      <button class="type-btn ae" id="btn-e" onclick="setType('expense')">支出</button>
      <button class="type-btn" id="btn-i" onclick="setType('income')">収入</button>
    </div>
    <div class="form-row"><label>金額（円）</label><input type="number" id="inp-amount" placeholder="1500" inputmode="numeric"></div>
    <div class="form-row"><label>メモ</label><input type="text" id="inp-name" placeholder="スーパー、給与など"></div>
    <div class="form-row"><label>カテゴリ</label>
      <select id="inp-cat">
        <option value="食費">🍱 食費</option>
        <option value="交通">🚃 交通</option>
        <option value="日用品">🧴 日用品</option>
        <option value="娯楽">🎮 娯楽</option>
        <option value="光熱費">💡 光熱費</option>
        <option value="医療">💊 医療</option>
        <option value="給与">💴 給与</option>
        <option value="その他">📦 その他</option>
      </select>
    </div>
    <div class="form-row"><label>日付</label><input type="date" id="inp-date"></div>
    <button class="save-btn" onclick="addEntry()">保存する</button>
    <button onclick="closeOverlay('add-overlay')" style="width:100%;height:44px;background:none;border:none;color:var(--text2);font-size:14px;margin-top:8px;cursor:pointer;">キャンセル</button>
  </div>
</div>

<!-- カメラ -->
<div class="overlay" id="cam-overlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2>レシートを撮影</h2>
    <div class="cam-preview">
      <video id="cam-video" autoplay playsinline style="display:none;"></video>
      <canvas id="cam-canvas" style="display:none;"></canvas>
      <div class="cam-ph" id="cam-ph"><i class="ti ti-camera"></i>「起動」を押してカメラを開始</div>
    </div>
    <div class="ai-box" id="ai-box">AIがレシートの金額・店名を自動で読み取ります</div>
    <div class="cam-btns">
      <button id="btn-start" onclick="startCam()"><i class="ti ti-camera" style="margin-right:4px;"></i>起動</button>
      <button class="shoot" id="btn-shoot" onclick="shoot()" disabled><i class="ti ti-aperture" style="margin-right:4px;"></i>撮影</button>
    </div>
    <button class="save-btn" id="btn-save-receipt" style="display:none;margin-top:10px;" onclick="saveReceipt()">この内容で保存</button>
    <button onclick="closeCam()" style="width:100%;height:44px;background:none;border:none;color:var(--text2);font-size:14px;margin-top:8px;cursor:pointer;">キャンセル</button>
  </div>
</div>

<!-- 予算設定 -->
<div class="overlay" id="budget-overlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2>予算を設定</h2>
    <div class="form-row">
      <label>月の支出予算（円）</label>
      <input type="number" id="inp-budget" placeholder="100000" inputmode="numeric">
    </div>
    <button class="save-btn" onclick="saveBudget()">保存する</button>
    <button onclick="closeOverlay('budget-overlay')" style="width:100%;height:44px;background:none;border:none;color:var(--text2);font-size:14px;margin-top:8px;cursor:pointer;">キャンセル</button>
  </div>
</div>

<script>
const SK='kakeibo_v3', BK='kakeibo_budget_v3';
const CAT={'食費':'🍱','交通':'🚃','日用品':'🧴','娯楽':'🎮','光熱費':'💡','医療':'💊','給与':'💴','その他':'📦'};
const ML=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
let entries=[], budget=100000, cy, cm, etype='expense', vstream=null, rdata=null;

function fmt(n){return '¥'+Math.round(n).toLocaleString('ja-JP');}
function load(){
  try{entries=JSON.parse(localStorage.getItem(SK))||[];}catch(e){entries=[];}
  try{budget=parseInt(localStorage.getItem(BK))||100000;}catch(e){budget=100000;}
}
function save(){
  try{localStorage.setItem(SK,JSON.stringify(entries));localStorage.setItem(BK,String(budget));}catch(e){}
}
function init(){
  const n=new Date(); cy=n.getFullYear(); cm=n.getMonth();
  document.getElementById('inp-date').value=n.toISOString().split('T')[0];
  load(); render();
}
function changeMonth(d){
  cm+=d;
  if(cm>11){cm=0;cy++;}if(cm<0){cm=11;cy--;}
  render();
}
function getMe(){return entries.filter(e=>{const d=new Date(e.date);return d.getFullYear()===cy&&d.getMonth()===cm;});}
function render(){
  document.getElementById('month-label').textContent=cy+'年'+ML[cm];
  const me=getMe();
  const inc=me.filter(e=>e.type==='income').reduce((s,e)=>s+e.amount,0);
  const exp=me.filter(e=>e.type==='expense').reduce((s,e)=>s+e.amount,0);
  document.getElementById('total-income').textContent=fmt(inc);
  document.getElementById('total-expense').textContent=fmt(exp);
  document.getElementById('total-balance').textContent=fmt(inc-exp);
  document.getElementById('summary-text').textContent=me.length+'件の記録';
  const pct=budget>0?Math.min(100,Math.round(exp/budget*100)):0;
  document.getElementById('budget-label').textContent=fmt(exp)+' / '+fmt(budget);
  document.getElementById('budget-fill').style.width=pct+'%';
  document.getElementById('budget-fill').style.background=pct>=90?'var(--red)':pct>=70?'#BA7517':'var(--green)';
  document.getElementById('budget-msg').textContent=pct>=100?'⚠️ 予算を超えました':'残り'+fmt(budget-exp)+'（'+（100-pct)+'%）';
  const list=document.getElementById('entry-list');
  const sorted=[...me].sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(!sorted.length){list.innerHTML='<div class="empty"><i class="ti ti-receipt-off"></i>まだ記録がありません</div>';return;}
  list.innerHTML=sorted.map(e=>`<div class="entry">
    <div class="icon" style="background:${e.type==='income'?'var(--green-bg)':'var(--red-bg)'}">${CAT[e.category]||'📦'}</div>
    <div class="info"><div class="name">${e.name}</div><div class="meta">${e.date} · ${e.category}</div></div>
    <div class="amount" style="color:${e.type==='income'?'var(--green)':'var(--red)'}">${e.type==='income'?'+':'-'}${fmt(e.amount)}</div>
  </div>`).join('');
}
function openAdd(){document.getElementById('add-overlay').classList.add('open');document.getElementById('inp-amount').focus();}
function closeOverlay(id){document.getElementById(id).classList.remove('open');}
function setType(t){
  etype=t;
  document.getElementById('btn-e').className='type-btn'+(t==='expense'?' ae':'');
  document.getElementById('btn-i').className='type-btn'+(t==='income'?' ai':'');
  document.getElementById('inp-cat').value=t==='income'?'給与':'食費';
}
function addEntry(){
  const a=parseFloat(document.getElementById('inp-amount').value);
  const n=document.getElementById('inp-name').value.trim()||'メモなし';
  const c=document.getElementById('inp-cat').value;
  const d=document.getElementById('inp-date').value||new Date().toISOString().split('T')[0];
  if(!a||a<=0){alert('金額を入力してください');return;}
  entries.push({id:Date.now(),type:etype,amount:a,name:n,category:c,date:d});
  save();render();
  document.getElementById('inp-amount').value='';
  document.getElementById('inp-name').value='';
  closeOverlay('add-overlay');
}
function openCamera(){document.getElementById('cam-overlay').classList.add('open');}
function closeCam(){
  document.getElementById('cam-overlay').classList.remove('open');
  if(vstream){vstream.getTracks().forEach(t=>t.stop());vstream=null;}
  document.getElementById('cam-video').style.display='none';
  document.getElementById('cam-ph').style.display='flex';
  document.getElementById('btn-shoot').disabled=true;
  document.getElementById('ai-box').textContent='AIがレシートの金額・店名を自動で読み取ります';
  document.getElementById('ai-box').className='ai-box';
  document.getElementById('btn-save-receipt').style.display='none';
  rdata=null;
}
async function startCam(){
  try{
    vstream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    const v=document.getElementById('cam-video');
    v.srcObject=vstream;v.style.display='block';
    document.getElementById('cam-ph').style.display='none';
    document.getElementById('btn-shoot').disabled=false;
  }catch(e){
    document.getElementById('cam-ph').innerHTML='<i class="ti ti-camera-off" style="font-size:36px;display:block;margin-bottom:8px;"></i>カメラへのアクセスが拒否されました';
  }
}
async function shoot(){
  const v=document.getElementById('cam-video');
  const canvas=document.getElementById('cam-canvas');
  canvas.width=v.videoWidth;canvas.height=v.videoHeight;
  canvas.getContext('2d').drawImage(v,0,0);
  const img=canvas.toDataURL('image/jpeg',0.7).split(',')[1];
  const ai=document.getElementById('ai-box');
  ai.textContent='🔍 AIが読み取り中...';ai.className='ai-box';
  document.getElementById('btn-shoot').disabled=true;
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:400,
        messages:[{role:'user',content:[
          {type:'image',source:{type:'base64',media_type:'image/jpeg',data:img}},
          {type:'text',text:'このレシートから情報を抽出してJSON形式のみで返答してください（説明なし、マークダウンなし）：{"shop":"店名","amount":金額の数値,"category":"食費/交通/日用品/娯楽/光熱費/医療/その他","date":"YYYY-MM-DD"}。日付不明なら今日の日付。'}
        ]}]
      })
    });
    const data=await res.json();
    const text=data.content?.map(c=>c.text||'').join('');
    const clean=text.replace(/```json|```/g,'').trim();
    const parsed=JSON.parse(clean);
    rdata=parsed;
    ai.innerHTML=`<strong>${parsed.shop}</strong><br>金額: ${fmt(parsed.amount)}<br>カテゴリ: ${CAT[parsed.category]||''} ${parsed.category}<br>日付: ${parsed.date}`;
    ai.className='ai-box done';
    document.getElementById('btn-save-receipt').style.display='block';
  }catch(e){
    ai.textContent='❌ 読み取りに失敗しました。もう一度試してください。';
    document.getElementById('btn-shoot').disabled=false;
  }
}
function saveReceipt(){
  if(!rdata)return;
  entries.push({id:Date.now(),type:'expense',amount:rdata.amount,name:rdata.shop||'レシート',category:rdata.category||'その他',date:rdata.date||new Date().toISOString().split('T')[0]});
  save();render();closeCam();
}
function openBudget(){
  document.getElementById('inp-budget').value=budget;
  document.getElementById('budget-overlay').classList.add('open');
}
function saveBudget(){
  const v=parseInt(document.getElementById('inp-budget').value);
  if(v>0){budget=v;save();render();}
  closeOverlay('budget-overlay');
}
document.querySelectorAll('.overlay').forEach(o=>{
  o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open');});
});
init();
</script>
</body>
</html>
